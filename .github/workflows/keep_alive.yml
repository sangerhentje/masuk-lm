name: Keep Supabase Alive

on:
  schedule:
    # Berjalan setiap hari pada jam 04:00 UTC (11:00 WIB)
    - cron: '0 4 * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankannya secara manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database & Table
        run: |
          echo "Pinging Supabase REST API & Database..."
          # 1. Query ke tabel asli 'applicants' (ambil 1 data saja agar query DB benar-benar berjalan)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/applicants?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}")
          
          echo "HTTP Response: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 206 ]; then
            echo "✅ Sukses! Supabase aktif dan berhasil merespon query data."
          else
            echo "⚠️ Respon bukan 200/206 (Status: $HTTP_STATUS), silakan periksa URL & Key."
            exit 1
          fi
